name: publishPackage
on:
  push:
    tags:
      - v*
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: checkout
      uses: actions/checkout@v6.0.2
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: setupNode
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: https://registry.npmjs.org
    - name: install
      run: bun install --frozen-lockfile
    - name: version
      run: node --eval "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag and package version differ.')"
    - name: quality
      run: bun run typecheck && bun run lint && bun run test && bun run audit
    - name: npm
      run: npm install --global npm@latest
    - name: pack
      run: bun run test:package
    - name: publish
      run: npm publish
